# Harbor task manifest (schema 1.4). This file is the Harbor-specific wrapper —
# everything under environment/, solution/, tests/ and instruction.md is plain
# files a future base layer could reuse.
schema_version = "1.4"

# The agent's actual work products, for human review — landing under
# jobs/<timestamp>/<trial>/artifacts/<destination> (harbor.trial.artifact_handler:
# entries with an explicit destination land at that relative path; the source
# is the absolute in-container path, collected from the agent's own container
# since no `service` is set). Collection is best-effort per entry
# (harbor.trial.artifact_handler._download_artifact wraps the download in a
# try/except that returns status="failed" in manifest.json rather than
# raising) and runs right after the agent/oracle phase, before the verifier —
# so a missing file (a failing run that never wrote a figure) does not fail
# the trial or turn a legitimate zero into an error; it is simply absent from
# artifacts/ with a "failed" manifest entry.
#
# Source paths mirror environment/project/contract.json's project_root and
# named result paths — task.toml can't import that JSON file at parse time
# (same limitation as the instruction files), so check_contract_drift.py
# validates these three entries against contract.json too.
artifacts = [
  { source = "/root/sn-cosmology/astra.yaml", destination = "astra.yaml" },
  { source = "/root/sn-cosmology/results/best_fit.json", destination = "best_fit.json" },
  { source = "/root/sn-cosmology/results/hubble_diagram.png", destination = "hubble_diagram.png" },
]

[task]
name = "lightcone/union21-omega-lambda"
version = "1.0.0"
description = "The agent must fit a flat-LCDM model to the Union2.1 supernova compilation for Omega_Lambda and reproduce Suzuki et al. 2012's own published constraint, which requires discovering two seeded defects (the systematics covariance matrix, and analytically marginalizing over the SN absolute magnitude) and, if it reaches for ASTRA, authoring an astra.yaml recording both as decisions with the paper's constraint verified as evidence."
keywords = ["astra", "cosmology", "supernovae", "spec-authoring", "evidence"]
[[task.authors]]
name = "cailmdaley"
email = "cailmdaley@gmail.com"

[metadata]
category = "natural-science"
difficulty = "medium"

[verifier]
timeout_sec = 420.0
collect = []

[verifier.env]

[agent]
timeout_sec = 1200.0

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []

[environment.env]

