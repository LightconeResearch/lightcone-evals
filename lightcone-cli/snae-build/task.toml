schema_version = "1.4"
artifacts = []

[task]
name = "lightcone/snae-build"
version = "0.3.0"
description = "Build a seeded ASTRA analysis end to end with lightcone-cli: complete the deliberately incomplete spec, write the recipe scripts, declare dependencies, materialize every output through the engine, and prepare the project for publication."
keywords = ["astronomy", "lightcone-cli", "astra", "build-from-scratch", "naive-usage", "provenance"]
[[task.authors]]
name = "dkn16"
email = "dkn16@foxmail.com"

[metadata]
category = "natural-science"
difficulty = "medium"
# Ported from lightcone-cli's own PR eval (.github/workflows/eval.yml +
# evals/tasks/snae at the pinned commit): same seed, same gate, oracle-gated
# and agent-agnostic. The prompt is deliberately NOT upstream's evals/prompt.md
# (a ~160-line CLI manual): it is what a user would type, so how to drive lc
# and astra must come from the skills or the CLIs' own help — which is what
# makes the skills-on vs skills-off comparison mean something.
# One line beyond it says the run is unattended: an agent that stops to ask
# a question ends the trial, and that is a fact about the harness, not a
# hint about lc.
source_format = "lightcone-cli-eval"
source_commit = "cd7c5399c43d591998f4cee774865d4e93099899"

[verifier]
timeout_sec = 600.0
collect = []

[verifier.env]

[agent]
# The upstream eval gives Claude Code 15 minutes / 200 turns; other harnesses
# are slower, and this must still fit the bench's 60-minute job with the
# image build.
timeout_sec = 1800.0

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []

[environment.env]

[solution.env]
