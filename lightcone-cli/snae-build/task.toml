schema_version = "1.4"
artifacts = []

[task]
name = "lightcone/snae-build"
version = "0.2.0"
description = "Operate a supplied analysis with lightcone-cli: selective execution, idempotency, decision and input invalidation, rollback and recovery, fresh-clone reproduction, and publication."
keywords = ["astronomy", "lightcone-cli", "astra", "execution", "incremental-build", "recovery", "provenance"]
[[task.authors]]
name = "dkn16"
email = "dkn16@foxmail.com"

[metadata]
category = "natural-science"
difficulty = "medium"
# Derived from the original build eval; v0.2 adds execution lifecycle
# checkpoints. Scores are not comparable to the v0.1 three-dimension rubric.
# source_commit below is historical provenance, not the tested CLI version.
source_format = "lightcone-cli-eval"
source_commit = "78059fab1608b033370558cfef3f5d6ffad26084"

[verifier]
timeout_sec = 600.0
collect = []

[verifier.env]

[agent]
# The upstream eval gives Claude Code 15 minutes / 200 turns; other harnesses
# are slower, and this must still fit the bench's 60-minute job with the
# image build.
timeout_sec = 1800.0

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []

[environment.env]

[solution.env]
