# ASTRA Analysis Specification
version: "0.0.14"
name: "snae"
description: |
  Fit the Union2.1 Type Ia supernova distance modulus versus redshift data
  to a flat LCDM cosmological model with two free parameters (H0, Omega_L)
  using maximum-likelihood point estimation, produce diagnostic figures, and
  quantify sampling uncertainty with independent bootstrap refits.

inputs:
  - id: union21
    type: data
    source: data/SCPUnion2.1_mu_vs_z.txt
    description: "Union2.1 SN Ia compilation: 580 supernovae with redshift, distance modulus, and uncertainties"

outputs:
  - id: best_fit
    type: metric
    format: zip
    description: "Best-fit H0 and Omega_L from chi-squared minimization, with reduced chi-squared"
    inputs: [union21]
    decisions: [optimizer, error_model, redshift_cut]
    recipe:
      command: >-
        python scripts/fit.py
        --data {inputs.union21}
        --output {output}
        --optimizer {decisions.optimizer}
        --error-model {decisions.error_model}
        --redshift-cut {decisions.redshift_cut}

  - id: hubble_diagram
    type: figure
    format: png
    description: "Hubble diagram: distance modulus versus redshift with best-fit model overlay"
    inputs: [union21, best_fit]
    recipe:
      command: >-
        python scripts/plot_hubble.py
        --data {inputs.union21}
        --fit {inputs.best_fit}
        --output {output}

  - id: residuals
    type: figure
    format: png
    description: "Residuals plot: data minus best-fit model versus redshift"
    inputs: [union21, best_fit]
    recipe:
      command: >-
        python scripts/plot_residuals.py
        --data {inputs.union21}
        --fit {inputs.best_fit}
        --output {output}

  - id: bootstrap_intervals
    type: metric
    format: zip
    description: "Bootstrap confidence intervals for H0 and Omega_L"
    inputs: [union21]
    decisions: [optimizer, error_model, redshift_cut, bootstrap_scale]
    recipe:
      command: >-
        python scripts/bootstrap.py
        --data {inputs.union21}
        --output {output}
        --optimizer {decisions.optimizer}
        --error-model {decisions.error_model}
        --redshift-cut {decisions.redshift_cut}
        --scale {decisions.bootstrap_scale}
        --workers 8
      resources:
        cpus: 8
        memory: "8GB"
        time_limit: "6h"

decisions:
  optimizer:
    label: "Optimizer"
    tags: [inference]
    rationale: "Nelder-Mead is robust and derivative-free; L-BFGS-B supports bounds natively"
    default: nelder_mead
    options:
      nelder_mead:
        label: "Nelder-Mead"
        description: "Derivative-free simplex optimizer"
      l_bfgs_b:
        label: "L-BFGS-B"
        description: "Bounded quasi-Newton optimizer"

  error_model:
    label: "Error Treatment"
    tags: [data]
    rationale: "The supplied table contains statistical errors but no systematic covariance matrix; a conservative systematic floor tests sensitivity to unmodeled systematics"
    default: stat_and_sys
    options:
      stat_only:
        label: "Statistical errors only"
        description: "Use only the statistical distance modulus uncertainties"
      stat_and_sys:
        label: "Statistical plus systematic floor"
        description: "Add a 0.03 mag irreducible systematic floor in quadrature"

  redshift_cut:
    label: "Low-Redshift Cut"
    tags: [data]
    rationale: "SNe at z below 0.01 are dominated by peculiar velocity scatter rather than cosmological signal"
    default: z_min_001
    options:
      none:
        label: "No cut"
        description: "Use all supernovae regardless of redshift"
      z_min_001:
        label: "z above 0.01"
        description: "Exclude supernovae with z below 0.01 to mitigate peculiar velocity contamination"

  bootstrap_scale:
    label: "Bootstrap scale"
    tags: [uncertainty]
    rationale: "More resamples reduce Monte Carlo noise in the reported confidence intervals at greater compute cost"
    default: production
    options:
      pilot:
        label: "Pilot"
        description: "Run 200 resamples to validate the implementation and measure cost"
      production:
        label: "Production"
        description: "Run 20,000 resamples for stable reported intervals"
