# Harbor task manifest (schema 1.4). This file is the Harbor-specific wrapper —
# everything under environment/, solution/, tests/ and instruction.md is plain
# files a future base layer could reuse.
schema_version = "1.4"
artifacts = []                          # extra run outputs to collect, if any

# Package info (harbor task init --no-package omits this; `harbor tasks update`
# manages it). Keep the lightcone/ prefix; folder name should match the suffix.
[task]
name = "lightcone/CHANGE-ME"
version = "0.1.0"
description = "One sentence: what must the agent accomplish, and what makes it non-trivial?"
keywords = ["astronomy"]
[[task.authors]]
name = "your-handle"
email = "you@example.com"

[metadata]
category = "natural-science"
difficulty = "medium"                   # easy | medium | hard
# Converted tasks additionally carry provenance here (source_format, source_path,
# source_commit, source_network_mode) — scripts/convert_task.py in lightcone-bench
# fills those in. Hand-written tasks omit them.

[verifier]
timeout_sec = 420.0
collect = []                            # extra verifier files to collect

[verifier.env]

[agent]
timeout_sec = 1200.0

[environment]
# "public" because Harbor agents install themselves (npm) and call model
# providers from inside the container. Tighten to an allowlist later if the
# task's intent is no-network.
network_mode = "public"
build_timeout_sec = 1800.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []

[environment.env]

[solution.env]
